name: Production Smoke Test

on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tg-md-bot.lechat-reg.workers.dev"
          EXPECTED="tg-md-bot: OK hardened-v1"

          for i in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 10 "$URL" || true)"
            echo "Attempt $i: $BODY"

            if [ "$BODY" = "$EXPECTED" ]; then
              echo "Production is on the expected version."
              exit 0
            fi

            sleep 10
          done

          echo "Production did not reach expected health version."
          exit 1

      - name: Check privacy page
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$(curl -fsS --max-time 15 "https://tg-md-bot.lechat-reg.workers.dev/privacy?lang=en")"

          echo "$PAGE" | grep -q "Markdown Formatter"
          echo "$PAGE" | grep -q "GPT-6.1"
          echo "$PAGE" | grep -q "github.com/l3chat/telegram-md-bot"

      - name: Check localized privacy page
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$(curl -fsS --max-time 15 "https://tg-md-bot.lechat-reg.workers.dev/privacy?lang=de")"

          echo "$PAGE" | grep -q "Datenschutz"
